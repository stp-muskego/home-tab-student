<style>
  :root{
    --ink:#1F2733; --muted:#5F6875; --line:#E3E6EA;
    --accent:#1E48B8; --ring:#8FB0E0;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink);
    font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center;
    justify-content:flex-start;
    padding:clamp(40px,10vh,96px) 24px 56px;
    background:#F6F7F9;
  }
  a{color:inherit; text-decoration:none;}

  /* ---------- background ---------- */
  /* A real <img>, not a CSS background-image. position:fixed + a CSS
     background at browser zoom levels other than 100% is a known Chromium
     bug -- the compositor can repaint the image tiled instead of scaled.
     An actual <img> with object-fit:cover scales correctly at any zoom. */
  .bg-frame{position:fixed; inset:0; z-index:-3; overflow:hidden; background:#F6F7F9;}
  .bg{width:100%; height:100%; object-fit:cover; object-position:center;
      display:block; opacity:0; transition:opacity 700ms ease;}
  .bg.on{opacity:1;}
  .bg-scrim{position:fixed; inset:0; z-index:-2; pointer-events:none;
      background:linear-gradient(180deg,rgba(12,16,22,.34) 0%,rgba(12,16,22,.10) 30%,rgba(12,16,22,.30) 100%);
      opacity:0; transition:opacity 700ms ease;}
  .bg-scrim.on{opacity:1;}
  body.photo{color:#fff;}

  /* ---------- masthead ---------- */
  .mast{display:flex; flex-direction:column; align-items:center; gap:14px;
        margin-bottom:clamp(30px,5vh,52px);}
  .crest{width:clamp(84px,12vw,116px); height:auto; display:block;
         filter:drop-shadow(0 4px 16px rgba(10,14,20,.30));}
  /* Institutional wordmark: uppercase, letterspaced, quiet.
     Prefer a serif instead? Swap the font-family line for:
        font-family:"Instrument Serif",Georgia,serif;
     and set text-transform:none; letter-spacing:.01em; font-size:24px; */
  .school{
    font-family:"Inter",system-ui,sans-serif; font-weight:600;
    font-size:clamp(17px,2.4vw,24px); letter-spacing:.12em; text-transform:uppercase;
    margin:0; color:var(--muted); text-align:center;
  }
  body.photo .school{color:rgba(255,255,255,.95); text-shadow:0 1px 10px rgba(8,12,18,.6);}
  .motto{
    font-family:"Instrument Serif",Georgia,serif; font-weight:400;
    font-size:clamp(16px,2.2vw,22px); letter-spacing:.012em; font-style:italic;
    margin:9px 0 0; color:var(--muted); text-align:center;
  }
  body.photo .motto{color:rgba(255,255,255,.9); text-shadow:0 1px 10px rgba(8,12,18,.6);}

  /* ---------- search ---------- */
  .search-wrap{width:100%; max-width:580px; margin-bottom:clamp(34px,6vh,54px);}
  .search{
    position:relative;
    display:flex; align-items:center; gap:15px;
    background:#fff; border:1px solid rgba(0,0,0,.05);
    border-radius:28px; padding:0 20px; height:56px;
    box-shadow:0 1px 4px rgba(12,16,22,.09), 0 10px 34px rgba(12,16,22,.10);
    transition:box-shadow 180ms ease, border-radius 180ms ease;
  }
  .search:hover{box-shadow:0 1px 4px rgba(12,16,22,.12), 0 12px 40px rgba(12,16,22,.16);}
  .search:focus-within{box-shadow:0 1px 4px rgba(12,16,22,.12), 0 12px 40px rgba(12,16,22,.18);}
  .search.suggesting{border-radius:28px 28px 0 0; box-shadow:0 1px 4px rgba(12,16,22,.12);}
  /* search-engine switcher: click the icon to pick where the box searches */
  .engine{position:relative; flex:0 0 auto;}
  .engine-btn{
    display:flex; align-items:center; gap:3px; border:0; background:transparent;
    padding:2px; cursor:pointer; border-radius:8px;
  }
  .engine-btn:hover{background:rgba(31,39,51,.06);}
  .engine-btn:focus-visible{outline:none; box-shadow:0 0 0 2px var(--ring);}
  .engine-btn .chev{width:9px; height:9px; opacity:.55;}
  .engine-menu{
    position:absolute; top:calc(100% + 10px); left:-6px; width:190px;
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:6px; box-shadow:0 12px 34px rgba(10,14,20,.18);
    display:none; z-index:40;
  }
  .engine-menu.open{display:block;}
  .engine-opt{
    display:flex; align-items:center; gap:10px; width:100%;
    border:0; background:transparent; text-align:left; cursor:pointer;
    font:inherit; font-size:13.5px; color:var(--ink);
    padding:9px 10px; border-radius:9px;
  }
  .engine-opt:hover{background:rgba(31,39,51,.055);}
  .engine-opt img{width:18px; height:18px; border-radius:5px; flex:0 0 auto;}
  .engine-opt.sel{font-weight:600;}
  .engine-opt.sel::after{content:"\2713"; margin-left:auto; color:var(--accent);}
  .search input{
    flex:1 1 auto; border:0; outline:0; background:transparent;
    font:inherit; font-size:16px; font-weight:400; color:var(--ink); height:100%;
    letter-spacing:.002em;
  }
  .search input::placeholder{color:#9AA2AE;}
  .search .go{
    flex:0 0 auto; border:0; background:transparent; padding:0;
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease;
  }
  .search .go:hover{background:rgba(31,39,51,.06);}
  .search .go:focus-visible{outline:none; box-shadow:0 0 0 2px var(--ring);}
  .search .go svg{width:19px; height:19px; fill:none; stroke:var(--muted); stroke-width:2.1;
    stroke-linecap:round; stroke-linejoin:round;}

  /* app suggestions -- from YOUR tiles only, never the open web */
  .suggest{
    position:absolute; top:100%; left:0; right:0;
    background:#fff; border-radius:0 0 20px 20px;
    box-shadow:0 12px 34px rgba(12,16,22,.16);
    padding:6px 0 10px; display:none; z-index:30;
    border-top:1px solid var(--line);
  }
  .suggest.open{display:block;}
  .sg-item{
    display:flex; align-items:center; gap:13px;
    padding:9px 20px; cursor:pointer; transition:background 110ms ease;
  }
  .sg-item:hover,.sg-item.active{background:rgba(31,39,51,.055);}
  .sg-item img{width:26px; height:26px; border-radius:7px; flex:0 0 auto;}
  .sg-name{font-size:14.5px; font-weight:500; color:var(--ink);}
  .sg-sub{font-size:12px; color:var(--muted); margin-left:auto;}

  /* ---------- shortcut grid ---------- */
  .board{
    width:100%; max-width:640px;
    display:grid; grid-template-columns:repeat(6,1fr);
    gap:10px 2px;
  }
  .tile{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:10px;
    padding:14px 4px 12px; border-radius:14px;
    transition:background 140ms ease;
  }
  .tile:hover{background:rgba(255,255,255,.16);}
  body:not(.photo) .tile:hover{background:rgba(31,39,51,.05);}
  .tile:focus-visible{outline:none; background:rgba(255,255,255,.26);
    box-shadow:0 0 0 2px var(--ring);}
  .badge{
    width:54px; height:54px; flex:0 0 auto;
    filter:drop-shadow(0 1px 2px rgba(10,14,20,.16)) drop-shadow(0 3px 8px rgba(10,14,20,.16));
    transition:transform 160ms cubic-bezier(.2,.8,.3,1);
  }
  .tile:hover .badge{transform:translateY(-2px) scale(1.04);}
  .badge img{width:100%; height:100%; display:block; object-fit:contain; background:transparent;}
  .badge .mono{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    background:var(--accent); color:#fff; font-family:"Instrument Serif",serif;
    font-size:26px; font-weight:500;
  }
  .label{
    font-size:11.5px; font-weight:500; line-height:1.3;
    text-align:center; color:var(--ink); max-width:90px;
    letter-spacing:.008em;
  }
  body.photo .label{color:#fff; text-shadow:0 1px 6px rgba(8,12,18,.7);}

  /* hover info overlay */
  .tip{
    position:absolute; bottom:calc(100% - 2px); left:50%;
    transform:translate(-50%,4px);
    background:rgba(24,30,40,.96); color:#fff;
    font-size:11px; font-weight:500; letter-spacing:.01em;
    padding:6px 11px; border-radius:8px; white-space:nowrap;
    opacity:0; pointer-events:none; text-shadow:none;
    transition:opacity 150ms ease, transform 150ms ease;
    z-index:5;
  }
  .tip::after{content:""; position:absolute; top:100%; left:50%;
    transform:translateX(-50%); border:5px solid transparent;
    border-top-color:rgba(24,30,40,.96);}
  .tile:hover .tip,.tile:focus-visible .tip{opacity:1; transform:translate(-50%,0);}

  /* ---------- waffle ---------- */
  /* ---- top bar: Images link, waffle, account (pinned top-right) ---- */
  .topbar{
    position:fixed; top:20px; right:20px; z-index:20;
    display:flex; align-items:center; gap:6px;
  }
  .topbar .tlink{
    font-size:13px; font-weight:500; letter-spacing:.005em;
    padding:8px 14px; border-radius:999px; white-space:nowrap;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.95);
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .topbar .tlink:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8); color:#3D4552;
  }
  .topbar .tlink:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  /* muted until the search box has text -- clicking it empty would land
     students on Google's personalised image feed, which is an endless
     scroll of whatever the algorithm thinks they like */
  .topbar .tlink.idle{opacity:.45; cursor:default;}
  .topbar .tlink.idle:hover{background:transparent; border-color:rgba(95,104,117,.5); color:rgba(95,104,117,.95);}
  body.photo .topbar .tlink.idle:hover{background:transparent; border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.95);}
  body.photo .topbar .tlink{
    border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.95);
  }
  body.photo .topbar .tlink:hover{
    background:rgba(255,255,255,.2); border-color:#fff; color:#fff;
  }
  /* outlined avatar: gray rim, gray glyph, transparent interior */
  .acct{
    width:38px; height:38px; border-radius:50%; flex:0 0 auto;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.85);
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .acct:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8);
    color:#3D4552;
  }
  .acct:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  .acct svg{width:19px; height:19px; display:block;}
  /* over a photo, switch the rim and glyph to white so it stays legible */
  body.photo .acct{
    border-color:rgba(255,255,255,.75);
    color:rgba(255,255,255,.92);
  }
  body.photo .acct:hover{
    background:rgba(255,255,255,.2);
    border-color:#fff; color:#fff;
  }

  .waffle-wrap{position:relative; z-index:20;}

  .foot{
    margin-top:30px; font-size:11.5px; font-weight:400;
    color:var(--muted); letter-spacing:.02em;
  }

  /* ---- weather widget (top-left) ---- */
  .weather{
    position:fixed; top:20px; left:22px; z-index:20;
    display:flex; align-items:center; gap:12px;
    padding:9px 16px 9px 14px; border-radius:18px;

    box-shadow:0 2px 10px rgba(10,14,20,.16);

  .wx-date{display:flex; flex-direction:column; line-height:1.18;}
  .wx-time{font-size:17px; font-weight:600; color:var(--ink); letter-spacing:-.02em;}
  .wx-day{font-size:11px; font-weight:500; color:var(--muted);}
  .weather{text-decoration:none;}
  .wx-sep{width:1px; height:26px; background:rgba(31,39,51,.12); display:none;}
  .wx-sep.on{display:block;}
  .wx-block{display:none; align-items:center; gap:9px;}
  .wx-block.on{display:flex;}
  .wx-ico{font-size:21px; line-height:1;}
  .wx-t{font-size:16px; font-weight:600; color:var(--ink); letter-spacing:-.01em; line-height:1.15;}
  .wx-d{font-size:10.5px; font-weight:500; color:var(--muted); line-height:1.2;}
  .wx-refresh{
    display:none; border:0; background:transparent; padding:4px; margin-left:2px;
    border-radius:50%; cursor:pointer; color:rgba(31,39,51,.45);
    align-items:center; justify-content:center; flex:0 0 auto;
  }
  .wx-refresh.on{display:flex;}
  .wx-refresh:hover{background:rgba(31,39,51,.08); color:rgba(31,39,51,.7);}
  .wx-refresh svg{width:14px; height:14px;}
  .wx-refresh.spinning svg{animation:wx-spin 700ms linear;}
  @keyframes wx-spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
  body.photo .wx-refresh{color:rgba(255,255,255,.55);}
  body.photo .wx-refresh:hover{background:rgba(255,255,255,.15); color:#fff;}

  /* ---- announcement strip ---- */
  .announce{
    display:none; align-items:center; gap:11px;
    max-width:600px; margin:0 0 22px;
    padding:11px 18px 11px 15px; border-radius:14px;
    background:rgba(255,255,255,.88);
    -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 2px 12px rgba(10,14,20,.14);
    border-left:3px solid var(--accent);
  }
  .announce.on{display:flex;}
  .announce .an-dot{
    width:7px; height:7px; border-radius:50%; background:var(--accent);
    flex:0 0 auto;
  }
  .announce .an-tx{
    font-size:13.5px; font-weight:500; color:var(--ink); line-height:1.4;
  }

  /* ---- verse of the day (bottom-left) ---- */
  .verse-wrap{position:fixed; bottom:20px; left:22px; z-index:25; max-width:min(430px,calc(100vw - 90px));}
  .verse-pill{
    display:inline-flex; align-items:center; gap:9px;
    padding:8px 15px 8px 12px; border-radius:999px; cursor:pointer;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.95);
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .verse-pill:hover{background:rgba(255,255,255,.4); border-color:rgba(95,104,117,.8); color:#3D4552;}
  .verse-pill:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  body.photo .verse-pill{border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.95);}
  body.photo .verse-pill:hover{background:rgba(255,255,255,.2); border-color:#fff; color:#fff;}
  .verse-pill .vx{font-size:15px; font-weight:600; line-height:1; margin-top:-1px;}
  .verse-pill .vref{
    font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    white-space:nowrap;
  }

  .verse-body{
    position:absolute; bottom:calc(100% + 9px); left:0; width:max-content;
    max-width:min(400px,calc(100vw - 90px));
    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
    border-radius:15px; padding:18px 21px;
    box-shadow:0 12px 34px rgba(10,14,20,.20);
    opacity:0; transform:translateY(5px); pointer-events:none;
    transition:opacity 170ms ease, transform 170ms ease;
  }
  .verse-wrap:hover .verse-body,
  .verse-pill:focus-visible + .verse-body{
    opacity:1; transform:translateY(0); pointer-events:auto;
  }

  /* PINNED: the pill steps aside and the verse itself becomes the control.
     A defined border (rather than a floating shadow) is the cue that this
     one is held open on purpose, not just hovering. */
  .verse-wrap.pinned .verse-pill{display:none;}
  .verse-wrap.pinned .verse-body{
    position:static; opacity:1; transform:none; pointer-events:auto;
    border:1.5px solid rgba(31,39,51,.30);
    box-shadow:0 6px 20px rgba(10,14,20,.16);
    cursor:pointer;
    transition:border-color 140ms ease, background 140ms ease;
  }
  .verse-wrap.pinned .verse-body:hover{
    border-color:rgba(31,39,51,.55);
    background:#fff;
  }
  /* small cross marks it as the same thing the pill was */
  .verse-wrap.pinned .verse-body .vr::before{
    content:"\2212  ";                 /* minus = click to close */
    font-weight:700; font-size:13px; letter-spacing:0; color:#98A0AC;
  }
  .verse-wrap.pinned .verse-body:hover .vr::before{ color:#5A6470; }
  .verse-body .vt{
    font-family:"Instrument Serif",Georgia,serif; font-style:italic;
    font-size:19px; line-height:1.48; color:#141A23; display:block;
  }
  .verse-body .vr{
    display:block; margin-top:10px;
    font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
    color:#5A6470;
  }

  /* ---- background customize control (bottom-right) ---- */
  .cust-wrap{position:fixed; bottom:20px; right:20px; z-index:25; display:none;}

  /* ---- quick notes (bottom-right, beside the background control) ---- */
  .notes-wrap{position:fixed; bottom:20px; right:68px; z-index:25;}
  .notes-btn{
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    background:transparent; border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.9);
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .notes-btn svg{width:18px; height:18px;}
  .notes-btn:hover{background:rgba(255,255,255,.4); border-color:rgba(95,104,117,.8); color:#3D4552;}
  .notes-btn:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  body.photo .notes-btn{border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.92);}
  body.photo .notes-btn:hover{background:rgba(255,255,255,.2); border-color:#fff; color:#fff;}

  .notes-panel{
    position:absolute; bottom:50px; right:0; width:264px;
    background:#fff; border:1px solid rgba(20,26,35,.06); border-radius:18px;
    padding:14px 16px 14px; box-shadow:0 18px 46px rgba(10,14,20,.20);
    display:none;
  }
  .notes-panel.open{display:block;}
  .notes-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:0 1px 10px; margin-bottom:9px; border-bottom:1px solid var(--line);
    font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
    color:var(--muted);
  }
  .notes-clear{
    border:0; background:transparent; cursor:pointer; padding:0;
    font:inherit; font-size:10.5px; font-weight:600; letter-spacing:.04em;
    text-transform:none; color:#B0473F; opacity:.85;
  }
  .notes-clear:hover{opacity:1; text-decoration:underline;}

  /* Scroll-capped at roughly 10 lines of height, not a fixed item count --
     a few long wrapped bullets take the same room as many short ones. */
  .notes-lines{
    max-height:224px; overflow-y:auto; overflow-x:hidden;
    display:flex; flex-direction:column;
    scrollbar-width:thin; scrollbar-color:#D8DCE2 transparent;
  }
  .notes-line{
    position:relative; padding:5px 2px 5px 17px; margin:0;
    font-size:13.5px; line-height:1.5; color:var(--ink);
    white-space:pre-wrap; word-wrap:break-word; word-break:break-word;
    outline:none; border-radius:8px;
    transition:background 100ms ease;
  }
  .notes-line::before{
    content:"\2022"; position:absolute; left:3px; top:5px;
    color:#B4BCC6; font-size:14px; line-height:1.5;
  }
  .notes-line:focus{background:rgba(31,39,51,.04);}
  .notes-line:empty::after{content:"Note or reminder\2026"; color:#B7BEC8;}
  .notes-lines::-webkit-scrollbar{width:6px;}
  .notes-lines::-webkit-scrollbar-thumb{background:#D8DCE2; border-radius:3px;}
  .cust-wrap.on{display:block;}
  .cust-btn{
    width:38px; height:38px; border-radius:50%; cursor:pointer;
    background:transparent;
    border:1.6px solid rgba(95,104,117,.5);
    color:rgba(95,104,117,.9);
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  .cust-btn:hover{
    background:rgba(255,255,255,.4);
    border-color:rgba(95,104,117,.8); color:#3D4552;
  }
  .cust-btn:focus-visible{outline:none; box-shadow:0 0 0 3px rgba(143,176,224,.6);}
  .cust-btn svg{width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:1.9;
    stroke-linecap:round; stroke-linejoin:round;}
  body.photo .cust-btn{
    border-color:rgba(255,255,255,.75); color:rgba(255,255,255,.92);
  }
  body.photo .cust-btn:hover{
    background:rgba(255,255,255,.2); border-color:#fff; color:#fff;
  }
  .cust-panel{
    position:absolute; bottom:50px; right:0; width:216px;
    background:#fff; border:1px solid var(--line); border-radius:16px;
    padding:7px; box-shadow:0 14px 40px rgba(10,14,20,.20);
    display:none;
  }
  .cust-panel.open{display:block;}
  .cust-head{
    font-size:10.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
    color:var(--muted); padding:7px 11px 8px;
  }
  .cust-opt{
    display:flex; align-items:center; gap:10px; width:100%;
    border:0; background:transparent; text-align:left; cursor:pointer;
    font:inherit; font-size:13.5px; color:var(--ink);
    padding:9px 11px; border-radius:10px;
    transition:background 110ms ease;
  }
  .cust-opt:hover{background:rgba(31,39,51,.055);}
  .cust-opt .chk{
    width:16px; height:16px; flex:0 0 auto; border-radius:50%;
    border:1.8px solid var(--line); display:flex; align-items:center; justify-content:center;
  }
  .cust-opt.sel .chk{border-color:var(--accent); background:var(--accent);}
  .cust-opt.sel .chk::after{content:""; width:5px; height:5px; border-radius:50%; background:#fff;}
  .cust-rule{height:1px; background:var(--line); margin:6px 11px;}

  /* waffle icon fallback when a favicon can't load */
  .wfallback{
    width:26px; height:26px; border-radius:7px; display:flex;
    align-items:center; justify-content:center; color:#fff;
    font-size:12px; font-weight:700; font-family:"Inter",sans-serif;
  }

  /* ---- mic / lens buttons in the search bar ---- */
  .search .tool{
    flex:0 0 auto; border:0; background:transparent; padding:0;
    width:34px; height:34px; border-radius:50%; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:background 140ms ease;
  }
  .search .tool:hover{background:rgba(31,39,51,.06);}
  .search .tool:focus-visible{outline:none; box-shadow:0 0 0 2px var(--ring);}
  .search .tool svg{width:19px; height:19px;}
  .search .tool.listening{background:rgba(234,67,53,.12);}
  .search .tool.listening svg{fill:#EA4335;}
  .divider{width:1px; height:22px; background:var(--line); flex:0 0 auto;}
  body.photo .foot{color:rgba(255,255,255,.9); text-shadow:0 1px 8px rgba(8,12,18,.6);}

  /* on narrower windows the fixed corner controls would run into the
     centered crest, so give the content room to clear them */
  @media (max-width:760px){
    body{padding-top:96px;}
    .topbar{top:14px; right:14px; gap:4px;}
    .topbar .tlink{font-size:12px; padding:6px 10px;}
    .weather{top:14px; left:14px; padding:7px 12px 7px 11px;}
    .wx-time{font-size:15px;}
  }
  @media (max-width:560px){
    body{padding-top:110px;}
    .topbar .tlink{display:none;}   /* Images link folds away; waffle + account remain */
  }
  /* the verse lives in the bottom-left corner; on small windows the board
     grows into that space, so it steps aside rather than overlapping */
  @media (max-width:900px), (max-height:700px){ .verse-wrap{display:none;} }
  @media (max-width:620px){ .board{grid-template-columns:repeat(4,1fr);} }
  @media (max-width:400px){ .board{grid-template-columns:repeat(3,1fr);} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important;} }
</style>

<script>
/* =================================================================
   THE LIST YOU MAINTAIN
   -----------------------------------------------------------------
   Each tile: { name, sub, url, icon }

  /* ---- shortcut grid ---- */
  /* ---- which tiles to show -------------------------------------
     The page reads ?g= from its own URL. Set a different URL per
     org unit in the Admin console and each group gets its own board:

        .../index.html?g=35            grades 3-5, no games
        .../index.html?g=35,games      grades 3-5 with the launcher
        .../index.html?g=68            grades 6-8, no games
        .../index.html?g=68,games      grades 6-8 with the launcher

     One file serves every group. Adding an app is one line here,
     tagged with who should see it. With no ?g= at all, everything
     except games shows -- handy for previewing. */
  const GROUPS = (new URLSearchParams(location.search).get("g") || "")
                   .split(",").map(s=>s.trim()).filter(Boolean);

  function visible(t){
    if (!t.groups) return true;                       // universal tile
    if (!GROUPS.length) return !t.groups.includes("games");  // preview mode
    return t.groups.some(g => GROUPS.includes(g));
  }

  /* ---- draw the board ---- */
  const board = document.getElementById("board");
  TILES.filter(visible).forEach(t => {
    const a = document.createElement("a");
    a.className = "tile"; a.href = t.url; a.setAttribute("aria-label", t.name);

    const badge = document.createElement("span"); badge.className = "badge";

    /* Icon order: an embedded image if this tile has one, otherwise the
       site's own icon fetched live, otherwise a plain lettered tile.
       That means you can add an app with just a name, url and domain --
       no icon file needed -- and it still looks finished. */
    if (t.icon && ICONS[t.icon]){
      const img = document.createElement("img"); img.alt = ""; img.src = ICONS[t.icon];
      badge.appendChild(img);
    } else {
      const host = t.domain || (function(){ try{ return new URL(t.url).hostname; }catch(e){ return ""; } })();
      const img = document.createElement("img"); img.alt = ""; img.loading = "lazy";
      img.src = "https://unavatar.io/" + host + "?fallback=false";
      img.onerror = function(){
        const alt = document.createElement("img"); alt.alt = ""; alt.loading = "lazy";
        alt.src = "https://www.google.com/s2/favicons?domain=" + host + "&sz=128";
        alt.onerror = function(){
          const m = document.createElement("span");
          m.className = "mono"; m.textContent = t.name.charAt(0);
          badge.replaceChildren(m);
        };
        badge.replaceChildren(alt);
      };
      badge.appendChild(img);
    }

    const label = document.createElement("span");
    label.className = "label"; label.textContent = t.name;

    a.append(badge, label);
    if (t.sub){
      const tip = document.createElement("span");
      tip.className = "tip"; tip.textContent = t.sub;
      a.appendChild(tip);
    }
    board.appendChild(a);
  });

  /* ---- when does "today" begin? ------------------------------------
     Both the verse and the background photo advance on this counter.
     Rolling over at 6am (not midnight) means the change has already
     happened before anyone opens a Chromebook, and nothing shifts
     under a student during the school day.
     Change ROLLOVER_HOUR if you ever want a different time. */
  const ROLLOVER_HOUR = 6;
  function schoolDay(){
    /* Shift back by the rollover hour, then count whole days using the
       resulting LOCAL calendar date. Reading the date parts (rather than
       subtracting milliseconds from a January baseline) keeps this immune
       to daylight saving -- otherwise the changeover would drift an hour
       between summer and winter. It also runs continuously across New
       Year instead of resetting. */
    const d = new Date(Date.now() - ROLLOVER_HOUR*3600000);
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  (function(){
    if (!VERSES.length){ document.getElementById("verseWrap").style.display="none"; return; }
    const v = VERSES[schoolDay() % VERSES.length];

    document.getElementById("verseRef").textContent  = v[1];
    document.getElementById("verseRef2").textContent = v[1];
    document.getElementById("verseText").textContent = "\u201C" + v[0] + "\u201D";

    const wrap = document.getElementById("verseWrap");
    const pill = document.getElementById("versePill");

    /* remembers pinned-open or pinned-closed on this device */
    try{ if (localStorage.getItem("versePinned") === "1") wrap.classList.add("pinned"); }catch(e){}

    function setPinned(on){
      wrap.classList.toggle("pinned", on);
      pill.setAttribute("aria-expanded", on ? "true" : "false");
      try{ localStorage.setItem("versePinned", on ? "1" : "0"); }catch(e){}

  /* ---- daily background photo -------------------------------
     A curated set YOU choose, living in a "bg" folder next to this
     page. One photo per day, rotating through the whole set, then
     starting over. Nothing is fetched from the internet.

     SETUP: make a folder named  bg  and put your photos in it,
     numbered with two digits:

         bg/01.jpg   bg/02.jpg   bg/03.jpg   ...

     Then set BG_COUNT below to how many you have. That's the only
     number to change. Twenty photos gives you about a month before
     one repeats; thirty gives you six weeks.

     Photos should be landscape, at least 1920 wide, saved as .jpg.
     If a photo is missing or BG_COUNT is 0, the page just shows its
     clean light background -- it never looks broken.
     ------------------------------------------------------------ */
  const BG_COUNT = 115;        // how many photos are in bg/
  const BG_EXT   = "jpg";      // change to "png" if yours are PNGs

  /* The two plain choices. Tweak these hex values if you want a
     different flat background. */
  const PLAIN = { white:"#FFFFFF", gray:"#F1F3F4" };

  (function(){
    const wrap  = document.getElementById("custWrap");
    const btn   = document.getElementById("custBtn");
    const panel = document.getElementById("custPanel");
    const bgEl  = document.getElementById("bg");
    const scrim = document.getElementById("scrim");
    const photoOpts = document.getElementById("photoOpts");

    /* the control is always available -- White/Gray work with or
       without photos. The two photo choices only appear once you've
       added a bg/ folder and set BG_COUNT. */
    wrap.classList.add("on");
    const hasPhotos = BG_COUNT >= 1;
    if (!hasPhotos) photoOpts.style.display = "none";
    /* "Mountains" always points at bg/01 -- the clouds-and-peaks shot.
       Change MOUNTAIN_N if that photo ever moves to a different number. */
    const MOUNTAIN_N = 1;
    if (!hasPhotos){
      const mb = panel.querySelector('[data-mode="mountains"]');
      if (mb){ mb.style.display = "none"; mb.nextElementSibling && (mb.nextElementSibling.style.display="none"); }
    }

    function pref(){
      try{
        const p = JSON.parse(localStorage.getItem("bgPref")||"null");
        if (p && p.mode) {
          /* if photos went away, fall back to a plain mode */
          if (!hasPhotos && (p.mode==="rotate" || p.mode==="lock" || p.mode==="mountains")) return {mode:"white"};
          return p;
        }
      }catch(e){}
      return { mode: hasPhotos ? "rotate" : "white" };
    }
    function save(p){ try{ localStorage.setItem("bgPref", JSON.stringify(p)); }catch(e){} }

    function todaysNumber(){ return (schoolDay() % BG_COUNT) + 1; }
    /* Filenames: tries 3-digit, then 2-digit, then unpadded, so it works
       whether the photos are named 001.jpg, 01.jpg, or 1.jpg. */
    function namesFor(n){
      return [ "bg/"+String(n).padStart(2,"0")+"."+BG_EXT,   // confirmed: 01.jpg
               "bg/"+String(n).padStart(3,"0")+"."+BG_EXT,
               "bg/"+n+"."+BG_EXT ];
    }

    function goPlain(hex){
      bgEl.classList.remove("on"); scrim.classList.remove("on");
      document.body.classList.remove("photo");
      document.body.style.background = hex;
      bgEl.removeAttribute("src");
      bgEl.parentElement.style.background = hex;   // the frame behind the <img>
    }

    function paint(){
      const p = pref();
      if (p.mode === "white" || p.mode === "gray"){
        goPlain(PLAIN[p.mode]); mark(); return;
      }
      let n;
      if (p.mode === "mountains")   n = MOUNTAIN_N;
      else if (p.mode === "lock" && p.n) n = p.n;
      else n = todaysNumber();

      const cands = namesFor(n);
      let i = 0;
      const pre = new Image();
      pre.onload = function(){
        bgEl.src = cands[i-1];
        bgEl.classList.add("on"); scrim.classList.add("on");
        document.body.classList.add("photo");
      };
      pre.onerror = function(){
        if (i < cands.length) pre.src = cands[i++];
        else goPlain(PLAIN.white);
      };
      pre.src = cands[i++];
      mark();
    }
    function mark(){
      const m = pref().mode;
      panel.querySelectorAll(".cust-opt").forEach(b =>
        b.classList.toggle("sel", b.dataset.mode === m));
    }

    panel.querySelectorAll(".cust-opt").forEach(b => {
      b.addEventListener("click", e => {
        e.stopPropagation();
        const mode = b.dataset.mode;
        if (mode === "lock"){
          /* pins whatever photo is showing right now */
          const cur = pref();
          const n = (cur.mode === "lock" && cur.n) ? cur.n : todaysNumber();
          save({mode:"lock", n:n});
        } else {
          save({mode:mode});
        }
        paint();
      });
    });

    btn.addEventListener("click", e => {
      e.stopPropagation();
      const open = panel.classList.toggle("open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", () => {
      panel.classList.remove("open");
      btn.setAttribute("aria-expanded","false");
    });

    paint();
  })();

  const ENGINES = [

  /* ---- app suggestions ------------------------------------------
     As you type, this matches against YOUR tiles only. It never
     contacts Google's suggestion service, so nothing from the open
     web can ever appear here. Enter still runs a normal Google
     search unless you arrow down onto an app first. */
  (function(){
    const input = document.getElementById("q");
    const box   = document.getElementById("suggest");
    const bar   = document.querySelector(".search");
    let matches = [], active = -1;

    function close(){
      box.classList.remove("open"); bar.classList.remove("suggesting");
      matches = []; active = -1;
    }
    function render(){
      box.innerHTML = "";
      matches.forEach((t,i) => {
        const row = document.createElement("div");
        row.className = "sg-item" + (i===active ? " active" : "");
        row.setAttribute("role","option");
        row.innerHTML = '<img src="'+ICONS[t.icon]+'" alt="">'
                      + '<span class="sg-name"></span>'
                      + '<span class="sg-sub"></span>';
        row.querySelector(".sg-name").textContent = t.name;
        row.querySelector(".sg-sub").textContent  = t.sub || "";
        row.addEventListener("mousedown", e => { e.preventDefault(); window.location.href = t.url; });
        box.appendChild(row);
      });
      box.classList.add("open"); bar.classList.add("suggesting");
    }
    input.addEventListener("input", () => {
      const v = input.value.trim().toLowerCase();
      if (v.length < 1){ close(); return; }
      matches = TILES.filter(t => t.name.toLowerCase().includes(v)).slice(0,4);
      active = -1;
      if (matches.length) render(); else close();
    });
    input.addEventListener("keydown", e => {
      if (!matches.length) return;
      if (e.key === "ArrowDown"){ e.preventDefault(); active = (active+1) % matches.length; render(); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); active = (active-1+matches.length) % matches.length; render(); }
      else if (e.key === "Enter" && active >= 0){ e.preventDefault(); window.location.href = matches[active].url; }
      else if (e.key === "Escape"){ close(); }
    });
    input.addEventListener("blur", () => setTimeout(close,120));
  })();

  /* ---- weather -------------------------------------------------
     Open-Meteo: no API key, free for educational use. Coordinates
     below are Muskego, WI. Cached for 10 minutes so a student
     opening many tabs a day only triggers a few calls -- if you ever
     want it fresher, lower CACHE_MINUTES. */
  const WX_LAT = 42.9111, WX_LON = -88.1287;
  const CACHE_MINUTES = 10;

  (function(){
    const CODES = {
      0:["\u2600\uFE0F","Clear"], 1:["\u{1F324}\uFE0F","Mostly clear"], 2:["\u26C5","Partly cloudy"],
      3:["\u2601\uFE0F","Cloudy"], 45:["\u{1F32B}\uFE0F","Fog"], 48:["\u{1F32B}\uFE0F","Fog"],
      51:["\u{1F327}\uFE0F","Light drizzle"], 53:["\u{1F327}\uFE0F","Drizzle"], 55:["\u{1F327}\uFE0F","Drizzle"],
      61:["\u{1F327}\uFE0F","Light rain"], 63:["\u{1F327}\uFE0F","Rain"], 65:["\u{1F327}\uFE0F","Heavy rain"],
      66:["\u{1F328}\uFE0F","Freezing rain"], 67:["\u{1F328}\uFE0F","Freezing rain"],
      71:["\u{1F328}\uFE0F","Light snow"], 73:["\u{1F328}\uFE0F","Snow"], 75:["\u2744\uFE0F","Heavy snow"],
      77:["\u2744\uFE0F","Snow grains"], 80:["\u{1F326}\uFE0F","Showers"], 81:["\u{1F326}\uFE0F","Showers"],
      82:["\u{1F326}\uFE0F","Heavy showers"], 85:["\u{1F328}\uFE0F","Snow showers"], 86:["\u{1F328}\uFE0F","Snow showers"],
      95:["\u26C8\uFE0F","Thunderstorm"], 96:["\u26C8\uFE0F","Thunderstorm"], 99:["\u26C8\uFE0F","Thunderstorm"]
    };

    function show(d){
      const c = CODES[d.code] || ["\u{1F321}\uFE0F",""];
      document.getElementById("wxIco").textContent = c[0];
      document.getElementById("wxT").textContent = Math.round(d.temp)+"\u00B0F";

      /* line 2: condition, feels-like when it differs, TODAY'S forecast
         range, rain chance. Labeled "Today" -- not "now" -- because the
         high/low are the whole day's forecast: before the afternoon peak
         or after the morning low, the current reading will never equal
         them. That's not a data error, it's what every weather app does;
         the label just says so instead of implying they should match. */
      const bits = [c[1]];
      if (d.feels != null && Math.abs(d.feels - d.temp) >= 3)
        bits.push("Feels "+Math.round(d.feels)+"\u00B0");
      if (d.hi != null) bits.push("Today "+Math.round(d.hi)+"\u00B0/"+Math.round(d.lo)+"\u00B0");
      if (d.rain != null && d.rain >= 20) bits.push(d.rain+"% rain");
      document.getElementById("wxD").textContent = bits.join("  \u00B7  ");

      document.getElementById("wxBlock").classList.add("on");
      document.getElementById("wxSep").classList.add("on");
      document.getElementById("wxRefresh").classList.add("on");
    }

    function fetchLive(){
      const url = "https://api.open-meteo.com/v1/forecast?latitude="+WX_LAT+"&longitude="+WX_LON+
                  "&current=temperature_2m,apparent_temperature,weather_code"+
                  "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
                  "&temperature_unit=fahrenheit&timezone=auto&forecast_days=1";
      return fetch(url).then(r=>r.json()).then(j=>{
        const d = {
          temp: j.current.temperature_2m,
          feels: j.current.apparent_temperature,
          code: j.current.weather_code,
          rain: (j.daily.precipitation_probability_max||[])[0],
          hi: j.daily.temperature_2m_max[0],
          lo: j.daily.temperature_2m_min[0],
          at: Date.now()
        };
        show(d);
        try{ localStorage.setItem("wx2", JSON.stringify(d)); }catch(e){}
      });
    }

    try{
      const c = JSON.parse(localStorage.getItem("wx2")||"null");
      if (c && typeof c.temp === "number" && Date.now()-c.at < CACHE_MINUTES*60000){ show(c); }
      else { fetchLive().catch(()=>{}); }
    }catch(e){ fetchLive().catch(()=>{}); }

    /* manual refresh: always hits the network, ignoring the cache */
    const refreshBtn = document.getElementById("wxRefresh");
    refreshBtn.addEventListener("click", e=>{
      e.preventDefault(); e.stopPropagation();
      refreshBtn.classList.add("spinning");
      fetchLive().finally(()=>{
        setTimeout(()=>refreshBtn.classList.remove("spinning"), 400);
      });
    });
  })();

  /* ---- voice search --------------------------------------------
     Uses the browser's built-in speech recognition (same thing that

     Chrome asks for microphone permission -- you can pre-approve
     this for the student OU in the Admin console so they never see
     the prompt. If the browser doesn't support it, the button hides. */
  (function(){
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  /* ---- announcements, fed by a Google Sheet -----------------------
     SETUP (one time):
       1. Make a Google Sheet with three columns in row 1:
             Message | Start | End
       2. Fill rows underneath. Examples:
             Chapel is at 10:30 today    | 2026-08-18       |
             Book fair all week!         | 2026-08-24       | 2026-08-28
          Start  = the day (or day and time) it begins showing.
                   Format: 2026-08-18   or   2026-08-18 08:00
          End    = optional last day it shows. Leave blank for
                   a single-day notice.
       3. File > Share > Publish to web > choose the sheet,
          pick "Comma-separated values (.csv)", click Publish.
       4. Paste that published URL into SHEET_CSV below.

     HOW IT EXPIRES (automatic, no cleanup needed):
       - No End date  -> disappears 12 hours after Start.
       - With End date -> shows through End, then disappears 12 hours
                          after that day closes (so it is gone by noon
                          the following day).
       Expired rows can sit in the Sheet forever; they never show.
       When nothing is active, the strip is completely invisible.

     Leave SHEET_CSV empty and the whole feature stays off. */
  const SHEET_CSV = "";

  (function(){
    if (!SHEET_CSV) return;

    /* CSV parser that respects quoted fields containing commas */
    function parseCSV(text){
      const rows=[]; let row=[], val="", q=false;
      for (let i=0;i<text.length;i++){
        const c=text[i];
        if (q){
          if (c === '"'){ if (text[i+1] === '"'){ val+='"'; i++; } else q=false; }
          else val+=c;
        } else {
          if (c === '"') q=true;
          else if (c === ","){ row.push(val); val=""; }
          else if (c === "\n"){ row.push(val); rows.push(row); row=[]; val=""; }
          else if (c !== "\r") val+=c;
        }
      }
      if (val.length || row.length){ row.push(val); rows.push(row); }
      return rows;
    }

    function parseDate(s){
      s=(s||"").trim(); if(!s) return null;
      const d=new Date(s.replace(" ","T"));
      return isNaN(d) ? null : d;
    }

    const TWELVE_HOURS = 12*60*60*1000;

    fetch(SHEET_CSV).then(r=>r.text()).then(txt=>{
      const rows=parseCSV(txt);
      if (rows.length < 2) return;
      const now=Date.now();

      for (let i=1;i<rows.length;i++){
        const msg=(rows[i][0]||"").trim();
        if(!msg) continue;
        const start=parseDate(rows[i][1]);
        if(!start) continue;
        const endRaw=parseDate(rows[i][2]);

        /* expiry: 12h after the End day closes, or 12h after Start */
        let expiry;
        if (endRaw){
          const close=new Date(endRaw); close.setHours(23,59,59,999);
          expiry = close.getTime() + TWELVE_HOURS;
        } else {
          expiry = start.getTime() + TWELVE_HOURS;
        }

        if (now >= start.getTime() && now < expiry){
          document.getElementById("announceText").textContent = msg;
          document.getElementById("announce").classList.add("on");
          return;   /* show the first active one only */
        }
      }
    }).catch(()=>{ /* unreachable Sheet: strip stays hidden */ });
  })();

  (function(){

  /* ---- quick notes ----------------------------------------------
     Bullets, autosaved as you type. Lives in this device's storage
     under this student's own Google account -- it stays all year
     unless they hit Clear, and only disappears entirely if the
     device itself is retired, since a new Chromebook starts empty.

     One line = one bullet. Typing wraps naturally within a bullet;
     pressing Enter starts a new one. The panel scrolls after roughly
     ten lines of height rather than capping at a fixed item count,
     since a few long wrapped bullets take the same room as many
     short ones. */
  (function(){
    const btn      = document.getElementById("notesBtn");
    const panel    = document.getElementById("notesPanel");
    const lines    = document.getElementById("notesLines");
    const clearBtn = document.getElementById("notesClear");
    let saveTimer;

    function load(){
      try{
        const a = JSON.parse(localStorage.getItem("quickNotes")||"[]");
        return Array.isArray(a) ? a.filter(v=>typeof v==="string") : [];
      }catch(e){ return []; }
    }
    function currentValues(){
      return Array.from(lines.querySelectorAll(".notes-line")).map(el=>el.textContent);
    }
    function scheduleSave(){
      clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>{
        try{ localStorage.setItem("quickNotes", JSON.stringify(currentValues())); }catch(e){}
      }, 250);
    }

    /* Chrome often leaves a stray <br> inside a contenteditable block
       after its text is fully deleted, which would stop it from ever
       matching :empty again -- and with it, the placeholder text. */
    function tidy(el){
      if (el.textContent.trim() === "" && el.innerHTML !== ""){ el.innerHTML = ""; }
    }

    function makeLine(text){
      const el = document.createElement("div");
      el.className = "notes-line";
      el.contentEditable = "plaintext-only";
      el.textContent = text || "";
      el.addEventListener("input", ()=>{ tidy(el); scheduleSave(); });
      el.addEventListener("paste", e=>{
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        document.execCommand("insertText", false, text);
      });
      return el;
    }

    function focusEnd(el){
      el.focus();
      const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
    }

    function render(values){
      lines.innerHTML = "";
      (values.length ? values : [""]).forEach(v => lines.appendChild(makeLine(v)));
    }

    render(load());

    lines.addEventListener("keydown", e=>{
      const line = e.target.closest(".notes-line");
      if (!line) return;

      if (e.key === "Enter"){
        e.preventDefault();
        const next = makeLine("");
        line.after(next);
        focusEnd(next);
        scheduleSave();
        return;
      }

      /* Backspace at the very start of a line merges it into the
         previous one, so empty bullets don't pile up with no way
         to remove them short of Clear. */
      if (e.key === "Backspace"){
        const sel = window.getSelection();
        const atStart = sel.isCollapsed && sel.anchorOffset === 0;
        const prev = line.previousElementSibling;
        if (atStart && prev){
          e.preventDefault();
          const joinAt = prev.textContent.length;
          prev.textContent = prev.textContent + line.textContent;
          line.remove();
          const r = document.createRange();
          r.setStart(prev.firstChild || prev, joinAt);
          r.collapse(true);
          const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
          prev.focus();
          scheduleSave();
        }
      }
    });

    btn.addEventListener("click", e=>{
      e.stopPropagation();
      const open = panel.classList.toggle("open");
      btn.setAttribute("aria-expanded", open?"true":"false");
      if (open){
        const last = lines.lastElementChild;
        if (last) focusEnd(last);
      }
    });
    document.addEventListener("click", e=>{
      if (panel.contains(e.target) || btn.contains(e.target)) return;
      panel.classList.remove("open"); btn.setAttribute("aria-expanded","false");
    });
    clearBtn.addEventListener("click", e=>{
      e.stopPropagation();
      render([]);
      try{ localStorage.setItem("quickNotes", "[]"); }catch(err){}
      focusEnd(lines.firstElementChild);
    });
  })();

  /* ---- press "/" to jump to the search box ---- */
  document.addEventListener("keydown", e => {

  /* ---- Google apps switcher ---- */
  /* Drive, Classroom and Gmail sit here as well as on the board on purpose --
     anyone who reaches for the waffle out of habit still finds them.
     Entries with "icon" reuse a tile already embedded in this file (so they
     always render); the rest pull Google's published product icon. */
  const WAFFLE_APPS = [
    { name:"Drive",    url:"https://drive.google.com",        icon:"drive",     color:"#4285F4" },
    { name:"Classroom",url:"https://classroom.google.com",    icon:"classroom", color:"#0F9D58" },

    { name:"Slides",   url:"https://slides.google.com",       key:"slides",     color:"#F4B400" },
    { name:"Sheets",   url:"https://sheets.google.com",       key:"sheets",     color:"#0F9D58" },
    { name:"Forms",    url:"https://forms.google.com",        key:"forms",      color:"#7248B9" },
    { name:"Calendar", url:"https://calendar.google.com",     key:"calendar",   color:"#4285F4" },
    { name:"Vids",     url:"https://vids.google.com",         key:"vids",       color:"#4285F4" },
    { name:"Drawings", url:"https://docs.google.com/drawings",key:"drawings",   color:"#EA4335" },
    { name:"Earth",    url:"https://earth.google.com",        key:"earth",      color:"#0F9D58" },
    { name:"Maps",     url:"https://maps.google.com",         key:"maps",       color:"#EA4335" }
  ];

  const wpanel = document.getElementById("wafflePanel");
  WAFFLE_APPS.forEach(app => {
    const it = document.createElement("a");
    it.className = "waffle-item"; it.href = app.url; it.setAttribute("role","menuitem");
    /* Google publishes each product's icon at a predictable path; if one is
       ever missing we fall back to a clean lettered tile in its brand colour. */
    const ico = document.createElement("img"); ico.alt = ""; ico.loading = "lazy";
    ico.src = (app.icon && ICONS[app.icon])
      ? ICONS[app.icon]
      : "https://www.gstatic.com/images/branding/product/2x/"+app.key+"_48dp.png";
    ico.onerror = function(){
      const f = document.createElement("span");
      f.className = "wfallback";
      f.style.background = app.color;
      f.textContent = app.name.charAt(0);
      ico.replaceWith(f);
    };
    const nm = document.createElement("span"); nm.textContent = app.name;
    it.append(ico, nm);
    wpanel.appendChild(it);
  });
  const wbtn = document.getElementById("waffleBtn");
  wbtn.addEventListener("click", e => {
    e.stopPropagation();
    const open = wpanel.classList.toggle("open");
    wbtn.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.addEventListener("click", () => {
    wpanel.classList.remove("open");
    wbtn.setAttribute("aria-expanded","false");
  });
</script>
</body>
</html>
